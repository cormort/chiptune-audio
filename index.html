<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chiptune-audio 控制台</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #dcdcd8; --accent: #2f6fdb; --accent-text: #fff; --wave: #2f6fdb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1f1f23; --text: #ececf0; --muted: #9a9aa3;
      --line: #34343a; --accent: #6b9cff; --accent-text: #0d0d10; --wave: #6b9cff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 56rem; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: .5rem 0 1rem; }
  h2 { font-size: 1.05rem; margin: 0 0 .75rem; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select, input[type=number] {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: .4rem .75rem; min-height: 2.25rem;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.on { outline: 2px solid var(--accent); }
  .params { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 6px 20px; margin: 12px 0; }
  .param { display: grid; grid-template-columns: 6.5rem 1fr 3.5rem; gap: 8px; align-items: center; }
  .param span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  canvas { width: 100%; height: 90px; display: block; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  pre { margin: 8px 0 0; padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
        overflow-x: auto; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
  .muted { color: var(--muted); font-size: 13px; }
  label.inline { display: inline-flex; gap: 6px; align-items: center; }
</style>

<main>
  <h1>chiptune-audio 控制台</h1>

  <section>
    <div class="row">
      <label class="inline">總音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="0.6" style="width:10rem"></label>
      <label class="inline"><input id="mute" type="checkbox"> 靜音</label>
    </div>
  </section>

  <section>
    <h2>音效</h2>
    <div class="row" id="presets"></div>
    <div class="params" id="params"></div>
    <canvas id="wave" width="900" height="90"></canvas>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="playSfx">▶ 播放</button>
      <button id="randomSfx">隨機</button>
      <button id="copySfx">複製參數</button>
      <span class="muted" id="sfxInfo"></span>
    </div>
    <pre id="sfxJson"></pre>
    <p class="muted">複製的參數可直接傳給 <code>audio.playSfx({...})</code>，或加進 <code>SFX_PRESETS</code>。</p>
  </section>

  <section>
    <h2>音樂</h2>
    <div class="row">
      <label class="inline">情緒 <select id="mood"></select></label>
      <label class="inline">種子 <input id="seed" type="number" value="1" min="1" style="width:6rem"></label>
      <button id="dice" title="隨機種子">🎲</button>
      <label class="inline">小節 <select id="bars"><option>4</option><option selected>8</option><option>16</option></select></label>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="playMusic">▶ 播放音樂</button>
      <button id="stopMusic">■ 停止</button>
      <span class="muted" id="musicInfo"></span>
    </div>
  </section>
</main>

<script type="module">
import { ChiptuneAudio, SFX_PRESETS, SFX_DEFAULTS, WAVE, renderSfx, generateSong, MOODS, SAMPLE_RATE } from './src/index.js';

const audio = new ChiptuneAudio({ volume: 0.6 });
const $ = (id) => document.getElementById(id);

// [key, label, min, max, step]
const SLIDERS = [
  ['freq', '頻率 Hz', 20, 3000, 1],
  ['slide', '滑音 oct/s', -8, 8, 0.1],
  ['duty', '脈寬', 0.05, 0.95, 0.01],
  ['dutySweep', '脈寬掃動', -2, 2, 0.05],
  ['vibDepth', '顫音深度', 0, 0.1, 0.001],
  ['vibRate', '顫音速度', 0, 40, 0.5],
  ['arpMult', '琶音倍率', 0.5, 2, 0.01],
  ['arpTime', '琶音時間', 0, 0.5, 0.01],
  ['bits', 'Bit-crush', 0, 8, 1],
  ['attack', '起音', 0, 0.3, 0.005],
  ['sustain', '持續', 0, 1, 0.01],
  ['decay', '衰減', 0, 1.5, 0.01],
  ['vol', '音量', 0, 1, 0.01],
];
const WAVE_NAMES = Object.keys(WAVE);   // SQUARE, SAW, TRIANGLE, NOISE

let params = { ...SFX_DEFAULTS };
const inputs = {};

// Wave selector + sliders
{
  const wrap = $('params');
  const div = document.createElement('label');
  div.className = 'param';
  div.innerHTML = '<span>波形</span><select id="waveSel"></select><span></span>';
  wrap.append(div);
  for (const n of WAVE_NAMES) $('waveSel').add(new Option(n, WAVE[n]));
  $('waveSel').onchange = (e) => { params.wave = +e.target.value; refresh(); };

  for (const [key, label, min, max, step] of SLIDERS) {
    const row = document.createElement('label');
    row.className = 'param';
    row.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}"><span></span>`;
    const input = row.querySelector('input');
    input.oninput = () => { params[key] = +input.value; refresh(); };
    input.onchange = () => audio.playSfx(params);   // release slider → hear it
    inputs[key] = input;
    wrap.append(row);
  }
}

for (const name of Object.keys(SFX_PRESETS)) {
  const b = document.createElement('button');
  b.textContent = name;
  b.dataset.preset = name;
  b.onclick = () => { load(SFX_PRESETS[name], name); audio.playSfx(params); };
  $('presets').append(b);
}

function load(preset, name = null) {
  params = { ...SFX_DEFAULTS, ...preset };
  for (const b of $('presets').children) b.classList.toggle('on', b.dataset.preset === name);
  refresh();
}

const round = (v) => Math.round(v * 1000) / 1000;

// Only the params that differ from the defaults, i.e. what you'd paste into a preset.
function diffParams() {
  const out = {};
  for (const k of Object.keys(SFX_DEFAULTS)) if (params[k] !== SFX_DEFAULTS[k]) out[k] = round(params[k]);
  return out;
}

function refresh() {
  $('waveSel').value = params.wave;
  for (const [key] of SLIDERS) {
    inputs[key].value = params[key];
    inputs[key].nextElementSibling.textContent = round(params[key]);
  }
  const samples = renderSfx(params);
  drawWave(samples);
  $('sfxInfo').textContent = `${(samples.length / SAMPLE_RATE).toFixed(2)} 秒`;
  $('sfxJson').textContent = JSON.stringify(diffParams());
}

function drawWave(samples) {
  const c = $('wave'), g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--wave');
  g.beginPath();
  const per = Math.max(1, Math.floor(samples.length / c.width));
  for (let x = 0; x < c.width; x++) {
    let lo = 0, hi = 0;
    for (let i = x * per; i < Math.min(samples.length, (x + 1) * per); i++) {
      lo = Math.min(lo, samples[i]); hi = Math.max(hi, samples[i]);
    }
    const mid = c.height / 2;
    g.moveTo(x + 0.5, mid - hi * mid);
    g.lineTo(x + 0.5, mid - lo * mid + 1);
  }
  g.stroke();
}

$('playSfx').onclick = () => audio.playSfx(params);
$('randomSfx').onclick = () => {
  const p = {};
  for (const [key, , min, max, step] of SLIDERS) p[key] = Math.round((min + Math.random() * (max - min)) / step) * step;
  p.wave = Math.floor(Math.random() * WAVE_NAMES.length);
  p.attack = Math.min(p.attack, 0.05);
  p.vol = 0.5;
  load(p);
  audio.playSfx(params);
};
$('copySfx').onclick = async () => {
  const text = JSON.stringify(diffParams());
  try { await navigator.clipboard.writeText(text); $('copySfx').textContent = '已複製'; }
  catch { $('copySfx').textContent = '請手動複製'; }
  setTimeout(() => { $('copySfx').textContent = '複製參數'; }, 1500);
};

// Music
for (const m of Object.keys(MOODS)) $('mood').add(new Option(m));
function playMusic() {
  const opts = { seed: +$('seed').value || 1, mood: $('mood').value, bars: +$('bars').value };
  audio.playMusic(opts);
  const song = generateSong(opts);
  $('musicInfo').textContent = `播放中：${song.bpm} BPM，循環 ${(song.bars * 16 * 15 / song.bpm).toFixed(1)} 秒`;
}
$('playMusic').onclick = playMusic;
$('dice').onclick = () => { $('seed').value = 1 + Math.floor(Math.random() * 99999); playMusic(); };
$('stopMusic').onclick = () => { audio.stopMusic(); $('musicInfo').textContent = ''; };
for (const id of ['mood', 'bars', 'seed']) $(id).onchange = () => { if (audio.music) playMusic(); };

$('volume').oninput = (e) => audio.setVolume(+e.target.value);
$('mute').onchange = (e) => audio.setMuted(e.target.checked);

load(SFX_PRESETS.coin, 'coin');
</script>
</html>
