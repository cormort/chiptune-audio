<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chiptune-audio 電子琴</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121420" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chiptune">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Silkscreen&display=swap">
<style>
  /* 電子琴：樂器 → 設定 → 琴鍵；按住發聲、放開停止，可多指和弦 */
  :root {
    --bg: #f3f4f7; --panel: #ffffff; --text: #1b1d24; --muted: #62677a;
    --line: #d9dce5; --accent: #3558d6; --accent-text: #ffffff;
    --key-white: #ffffff; --key-white-text: #62677a; --key-black: #22252f; --key-black-text: #c6cad8;
    --font-display: "Silkscreen", ui-monospace, monospace;
    --font-body: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121420; --panel: #1b1e2c; --text: #e8eaf2; --muted: #9ba1b7;
      --line: #313548; --accent: #7d9bff; --accent-text: #0e1020;
      --key-white: #d9dce7; --key-white-text: #4a4f63; --key-black: #0b0c14; --key-black-text: #8a90a8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121420; --panel: #1b1e2c; --text: #e8eaf2; --muted: #9ba1b7;
    --line: #313548; --accent: #7d9bff; --accent-text: #0e1020;
    --key-white: #d9dce7; --key-white-text: #4a4f63; --key-black: #0b0c14; --key-black-text: #8a90a8;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font-body); }
  main { max-width: 56rem; margin: 0 auto; padding: 16px; }
  h1, h2 { font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; text-wrap: balance; }
  h1 { font-size: 1.5rem; margin: .5rem 0 1rem; }
  h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
  a { color: var(--accent); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: .4rem .75rem; min-height: 2.25rem;
  }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  input[type=range] { accent-color: var(--accent); }
  .muted { color: var(--muted); font-size: 13px; }
  label.inline { display: inline-flex; gap: 6px; align-items: center; }
  .instruments { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: 8px; }
  #held { font: 13px var(--font-mono); color: var(--muted); min-height: 1.2em; }

  /* 琴鍵：白鍵平均分寬，黑鍵以百分比絕對定位在兩個白鍵之間 */
  .keys { position: relative; display: flex; height: 180px; margin: 12px 0 8px; user-select: none; touch-action: none; }
  .key { position: relative; border: 1px solid var(--line); border-radius: 0 0 6px 6px; padding: 0 0 6px;
         display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
         font: 11px/1.2 var(--font-mono); cursor: pointer; }
  .key.white { flex: 1; min-width: 0; background: var(--key-white); color: var(--key-white-text); margin-right: -1px; }
  .key.black { position: absolute; top: 0; height: 60%; z-index: 1; background: var(--key-black);
               color: var(--key-black-text); border-color: var(--key-black); }
  .key.down { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .key b { font-weight: 700; color: inherit; }
  .key i { font-style: normal; line-height: .6; }
</style>

<main>
  <header>
    <h1>chiptune-audio 電子琴</h1>
    <a href="index.html">← 控制台</a>
  </header>

  <section>
    <h2>樂器</h2>
    <div class="row" role="group" aria-label="音色模式" style="margin-bottom:10px">
      <button id="bankChip" class="on" aria-pressed="true">晶片音色</button>
      <button id="bankReal" aria-pressed="false">寫實合成</button>
      <button id="bankAcoustic" aria-pressed="false">物理擬真鋼琴</button>
      <button id="bankSample" aria-pressed="false">真實平台鋼琴 (取樣)</button>
      <span class="muted" id="bankHint"></span>
    </div>
    <div class="instruments" id="instruments"></div>
  </section>

  <section>
    <div class="row">
      <label class="inline">音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="0.6" style="width:8rem"></label>
      <label class="inline">八度 <select id="octave"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label>
      <label class="inline">標示 <select id="keyLabel"><option value="key">電腦按鍵</option><option value="name">音名</option><option value="num">簡譜</option></select></label>
    </div>
    <div class="keys" id="keys"></div>
    <div id="held" aria-live="polite"></div>
    <p class="muted">按住琴鍵持續發聲，放開停止，可以同時按多個鍵彈和弦；鋼琴、撥弦、鐘聲會自然衰減。<br>
      • <b>晶片音色</b>：單一振盪器的 8-bit 復古遊戲聲。<br>
      • <b>寫實合成</b>：疊上泛音、微走音與起音雜訊（純程式碼零依賴）。<br>
      • <b>物理擬真鋼琴</b>：基於弦剛度非諧波性與頻率動態衰減物理模型，溫潤自然且 100% 離線。<br>
      • <b>真實平台鋼琴</b>：Yamaha C5 史坦威等級真實立體聲錄音取樣，支援永久離線快取。<br>
      電腦鍵盤：下排 <kbd>Z</kbd>–<kbd>M</kbd>（黑鍵 <kbd>S D G H J</kbd>）是低八度，
      上排 <kbd>Q</kbd>–<kbd>U</kbd>（黑鍵 <kbd>2 3 5 6 7</kbd>）是高八度。</p>
  </section>
</main>

<script type="module">
// Offline / installable app (see sw.js). Service workers need http(s), not file://.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

import {
  ChiptuneAudio, INSTRUMENT_BANKS, INSTRUMENT_LABELS, instrumentNote, instrumentRelease, noteFreq,
  AcousticPiano, SampledPiano,
} from './src/index.js';

const audio = new ChiptuneAudio({ volume: 0.6 });
const acousticPiano = new AcousticPiano(() => audio._ensure(), () => audio.master);
const sampledPiano = new SampledPiano(() => audio._ensure(), () => audio.master);
const $ = (id) => document.getElementById(id);

// Voicing banks: `chip` (8-bit), `real` (12 synthetic slots), `acoustic` (HQ physics), `sample` (Grand Piano samples)
let bank = 'chip';
let instrument = 'square';

const ACOUSTIC_INSTRUMENTS = {
  standard: '標準鋼琴',
  mellow: '柔和琴音',
  bright: '明亮鋼琴',
};

const SAMPLE_INSTRUMENTS = {
  grand: 'Yamaha C5 平台鋼琴',
};

function buildInstruments() {
  const wrap = $('instruments');
  wrap.textContent = '';
  
  if (bank === 'acoustic') {
    for (const [key, label] of Object.entries(ACOUSTIC_INSTRUMENTS)) {
      const b = document.createElement('button');
      b.textContent = label;
      b.dataset.name = key;
      b.onclick = () => { instrument = key; paintInstruments(); };
      wrap.append(b);
    }
  } else if (bank === 'sample') {
    for (const [key, label] of Object.entries(SAMPLE_INSTRUMENTS)) {
      const b = document.createElement('button');
      b.textContent = label;
      b.dataset.name = key;
      b.onclick = () => { instrument = key; paintInstruments(); };
      wrap.append(b);
    }
  } else {
    const labels = INSTRUMENT_LABELS[bank];
    for (const name of Object.keys(INSTRUMENT_BANKS[bank])) {
      const b = document.createElement('button');
      b.textContent = labels[name] || name;
      b.dataset.name = name;
      b.onclick = () => { instrument = name; paintInstruments(); };
      wrap.append(b);
    }
  }
  paintInstruments();
}
function paintInstruments() {
  for (const b of $('instruments').children) {
    const on = b.dataset.name === instrument;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  }
}
function setBank(next) {
  if (bank === next) return;
  bank = next;
  if (bank === 'acoustic') {
    instrument = 'standard';
    $('bankHint').textContent = '多泛音物理頻散與琴槌動態衰減，100% 離線純演算法溫潤琴音';
  } else if (bank === 'sample') {
    instrument = 'grand';
    $('bankHint').textContent = '準備載入真實平台鋼琴取樣（支援 CacheStorage 永久離線快取）...';
    sampledPiano.preload((loaded, total) => {
      if (bank === 'sample') {
        $('bankHint').textContent = `真實平台鋼琴取樣已就緒 (${loaded}/${total})，隨按即響`;
      }
    });
  } else {
    // Keep the same slot when the new bank has it (piano, organ, flute, ...).
    if (!INSTRUMENT_BANKS[bank][instrument]) instrument = Object.keys(INSTRUMENT_BANKS[bank])[0];
    $('bankHint').textContent = bank === 'real'
      ? '疊泛音、微走音與起音雜訊，接近真實樂器'
      : '單一振盪器，8-bit 遊戲音色';
  }

  for (const [id, name] of [['bankChip', 'chip'], ['bankReal', 'real'], ['bankAcoustic', 'acoustic'], ['bankSample', 'sample']]) {
    const el = $(id);
    if (!el) continue;
    const on = bank === name;
    el.classList.toggle('on', on);
    el.setAttribute('aria-pressed', String(on));
  }
  buildInstruments();
}
$('bankChip').onclick = () => setBank('chip');
$('bankReal').onclick = () => setBank('real');
$('bankAcoustic').onclick = () => setBank('acoustic');
$('bankSample').onclick = () => setBank('sample');
buildInstruments();
$('bankHint').textContent = '單一振盪器，8-bit 遊戲音色';

const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
// Tracker layout; index = semitones above the keyboard's lowest C.
const KEYMAP = ['z', 's', 'x', 'd', 'c', 'v', 'g', 'b', 'h', 'n', 'j', 'm',
                'q', '2', 'w', '3', 'e', 'r', '5', 't', '6', 'y', '7', 'u', 'i'];
// 簡譜: 1 = C; a dot above marks each octave above the keyboard's lowest one.
const NUMBERS = ['1', '#1', '2', '#2', '3', '4', '#4', '5', '#5', '6', '#6', '7'];
const OCTAVE_DOTS = ['', '·', '··'];
const keyEls = [];
const baseMidi = () => 12 * (+$('octave').value + 1);   // C4 = midi 60
const noteName = (n) => NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);
{
  const WHITES = 15;   // two octaves plus the top C
  let white = 0;
  for (let i = 0; i < KEYMAP.length; i++) {
    const black = NOTE_NAMES[i % 12].includes('#');
    const el = document.createElement('div');
    el.className = `key ${black ? 'black' : 'white'}`;
    if (black) {
      el.style.left = `${(white - 0.3) / WHITES * 100}%`;
      el.style.width = `${0.6 / WHITES * 100}%`;
    } else {
      white++;
    }
    el.innerHTML = '<b></b><i></i><span></span>';
    el.dataset.i = i;
    keyEls.push(el);
    $('keys').append(el);
  }
}
function keyLabel(i) {
  switch ($('keyLabel').value) {
    case 'name': return NOTE_NAMES[i % 12];
    case 'num': return NUMBERS[i % 12];
    default: return KEYMAP[i].toUpperCase();
  }
}
function labelKeys() {
  keyEls.forEach((el, i) => {
    el.firstChild.textContent = i % 12 === 0 ? noteName(baseMidi() + i) : '';
    el.children[1].textContent = $('keyLabel').value === 'num' ? OCTAVE_DOTS[Math.floor(i / 12)] : '';
    el.lastChild.textContent = keyLabel(i);
  });
}

// A held note: which key, the engine handle, and the instrument and bank it
// started with (so switching either mid-chord still releases every note with the
// right fade).
const held = new Set();
function noteOn(i) {
  const n = baseMidi() + i;
  let voice;
  if (bank === 'sample') {
    voice = sampledPiano.playNote(n, { vel: 0.85 });
  } else if (bank === 'acoustic') {
    voice = acousticPiano.playNote(n, { preset: instrument, vel: 0.85 });
  } else {
    voice = audio.playNote(instrumentNote(instrument, n, { bank }));
  }
  const note = { i, n, voice, instrument, bank };
  held.add(note);
  paintHeld();
  return note;
}
function noteOff(note) {
  if (!note || !held.delete(note)) return;
  const fade = (note.bank === 'sample' || note.bank === 'acoustic') ? 0.22 : instrumentRelease(note.instrument, note.bank);
  if (note.voice && fade !== null) note.voice.release(fade);
  paintHeld();
}
function paintHeld() {
  const down = new Set([...held].map((h) => h.i));
  keyEls.forEach((el, i) => el.classList.toggle('down', down.has(i)));
  const notes = [...held].sort((a, b) => a.n - b.n);
  $('held').textContent = notes.map((h) => `${noteName(h.n)} ${noteFreq(h.n).toFixed(1)} Hz`).join(' · ');
}

// Pointer: one note per finger/mouse; dragging to another key moves the note.
const byPointer = new Map();
$('keys').onpointerdown = (e) => {
  const el = e.target.closest('.key');
  if (!el) return;
  el.releasePointerCapture?.(e.pointerId);   // touch captures to the key; release so pointerover reaches the others
  noteOff(byPointer.get(e.pointerId));
  byPointer.set(e.pointerId, noteOn(+el.dataset.i));
};
$('keys').onpointerover = (e) => {
  const cur = byPointer.get(e.pointerId);
  const el = e.target.closest('.key');
  if (!cur || !el || +el.dataset.i === cur.i) return;
  noteOff(cur);
  byPointer.set(e.pointerId, noteOn(+el.dataset.i));
};
const pointerEnd = (e) => { noteOff(byPointer.get(e.pointerId)); byPointer.delete(e.pointerId); };
addEventListener('pointerup', pointerEnd);
addEventListener('pointercancel', pointerEnd);

// Computer keyboard.
const byKey = new Map();
addEventListener('keydown', (e) => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  // The target is not always an Element (a synthetic event on window, or a
  // browser that reports document), and typing in a control must not play notes.
  if (e.target && e.target.closest && e.target.closest('input, select, textarea')) return;
  const k = e.key.toLowerCase();
  const i = KEYMAP.indexOf(k);
  if (i < 0 || byKey.has(k)) return;
  e.preventDefault();
  byKey.set(k, noteOn(i));
});
addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  noteOff(byKey.get(k));
  byKey.delete(k);
});
// Keys held while the window loses focus never get a keyup.
addEventListener('blur', () => {
  for (const note of [...held]) noteOff(note);
  byKey.clear();
  byPointer.clear();
});

$('octave').onchange = labelKeys;
$('keyLabel').onchange = labelKeys;
$('volume').oninput = (e) => audio.setVolume(+e.target.value);
labelKeys();
</script>
</html>
