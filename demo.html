<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chiptune-audio demo</title>
<style>body{font:16px system-ui;max-width:32rem;margin:2rem auto;padding:0 16px}button{margin:.25rem;padding:.5rem .9rem}</style>
<h1>chiptune-audio</h1>
<h2>SFX</h2><div id="sfx"></div>
<h2>Music</h2>
<label>Mood <select id="mood"><option>happy</option><option>calm</option><option>tense</option></select></label>
<label>Seed <input id="seed" type="number" value="1" style="width:5rem"></label>
<button id="play">Play</button><button id="stop">Stop</button>
<script type="module">
import { ChiptuneAudio, SFX_PRESETS } from './src/index.js';
const audio = new ChiptuneAudio();
const $ = (id) => document.getElementById(id);
for (const name of Object.keys(SFX_PRESETS)) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => audio.playSfx(name);
  $('sfx').append(b);
}
$('play').onclick = () => audio.playMusic({ seed: +$('seed').value, mood: $('mood').value });
$('stop').onclick = () => audio.stopMusic();
</script>
