<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chiptune-audio 卡林巴琴</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121420" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chiptune">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字型不擋首次繪製：先用系統字，網路字型到了再換（手機慢網路差最多） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Silkscreen&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Silkscreen&display=swap"></noscript>
<!-- 共用權杖與基礎元素；頁面自己的版面在下一個 <style> -->
<link rel="stylesheet" href="page/theme.css">
<style>
  /* GarageBand 世界樂器卡林巴琴：桃花心木／胡桃木共鳴箱 + 中央鑲邊音孔 + 金屬壓橋 + 17 根鍛造鋼簧 */
  .kalimba {
    position: relative;
    height: 356px;
    margin: 14px 0 10px;
    border-radius: 20px;
    border: 2px solid #3c2210;
    background:
      radial-gradient(ellipse at 50% 62%, rgba(255, 195, 128, 0.14) 0%, transparent 60%),
      repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.04) 0px, rgba(0, 0, 0, 0.04) 3px, transparent 3px, transparent 9px),
      linear-gradient(180deg, #8c5327 0%, #6e3d19 48%, #4d290f 85%, #381d0a 100%);
    box-shadow:
      inset 0 2px 1px rgba(255, 224, 180, 0.28),
      inset 0 -18px 32px rgba(0, 0, 0, 0.65),
      inset 0 0 40px rgba(20, 8, 0, 0.55),
      0 14px 30px rgba(0, 0, 0, 0.65);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overflow: hidden;
  }
  .field { position: absolute; left: 0; right: 0; top: 28px; bottom: 62px; }
  /* 真實共鳴音孔（Soundhole & Wooden Rosette Ring） */
  .field::before {
    content: "";
    position: absolute;
    left: 50%; top: 68%;
    width: 118px; height: 118px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
      radial-gradient(circle, #090503 0%, #140a04 54%, #2a1508 58%, #d4a359 61%, #573114 64%, #c8964e 67%, transparent 70%);
    box-shadow: inset 0 6px 14px rgba(0, 0, 0, 0.95), 0 1px 2px rgba(255, 215, 150, 0.25);
    pointer-events: none;
  }
  /* 木枕與不鏽鋼拉絲壓桿（Saddle & Metal Tension Bar） */
  .bridge {
    position: absolute; left: 3.5%; right: 3.5%; top: 0; height: 16px; z-index: 3;
    background:
      radial-gradient(circle at 3% 50%, #f8fafc 0%, #64748b 4px, transparent 5px),
      radial-gradient(circle at 50% 50%, #f8fafc 0%, #64748b 4px, transparent 5px),
      radial-gradient(circle at 97% 50%, #f8fafc 0%, #64748b 4px, transparent 5px),
      linear-gradient(180deg, #4b2a12 0%, #2b1607 25%, #e2e8f0 28%, #94a3b8 55%, #cbd5e1 72%, #475569 78%, #8f6b3e 80%, #5c3f1e 100%);
    border-radius: 4px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.65);
  }
  /* 17 根鍛造鋼簧片：尾端圓弧打磨與金屬高光 */
  .tine {
    position: absolute; top: 0; width: 3.15%;
    transform: translateX(-50%); transform-origin: top center;
    border-radius: 2px 2px 99px 99px;
    background: linear-gradient(90deg, #525861 0%, #c8d0da 32%, #f8fafc 48%, #9aa3ae 68%, #474d56 100%);
    border: 1px solid rgba(25, 28, 34, 0.55);
    box-shadow:
      inset 0 -6px 4px rgba(255, 255, 255, 0.45),
      0 6px 10px rgba(0, 0, 0, 0.65);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    z-index: 2;
  }
  .tine .label {
    position: absolute; left: 50%; bottom: -2.65em; transform: translateX(-50%);
    font: 11px/1.25 var(--font-mono); color: #fde68a; text-align: center; white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95); pointer-events: none;
  }
  .tine .label b { display: block; font-weight: 700; font-size: 12px; }
  .tine .label .key { display: block; font-size: 10px; color: #93c5fd; opacity: .9; }
  .tine:hover {
    background: linear-gradient(90deg, #747c87 0%, #eef2f7 36%, #ffffff 50%, #bac3cf 68%, #656d78 100%);
  }
  .tine.down {
    background: linear-gradient(90deg, #b45309 0%, #fde68a 38%, #fffbeb 50%, #f59e0b 68%, #92400e 100%);
    box-shadow: 0 0 16px 3px rgba(251, 191, 36, 0.8), 0 6px 10px rgba(0, 0, 0, 0.65);
    animation: pluck .45s cubic-bezier(.2, .8, .3, 1);
  }
  @keyframes pluck {
    0% { transform: translateX(-50%) scaleX(1.85); }
    35% { transform: translateX(-50%) scaleX(.76); }
    100% { transform: translateX(-50%) scaleX(1); }
  }
  @media (prefers-reduced-motion: reduce) { .tine.down { animation: none; } }

  /* LCD 讀數窗與 GarageBand 紅色圓形錄音鍵 */
  #held, #recInfo {
    font: 12.5px/1.4 var(--font-mono);
    background: var(--lcd-bg);
    color: var(--lcd-text);
    padding: 5px 12px;
    border-radius: 8px;
    border: 1px solid #2d3548;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.85);
  }
  #held {
    height: 2.2rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.5;
    color: var(--lcd-sub);
  }
  #held:empty::before {
    content: "READY · 點按或滑過簧片刮奏";
    color: #546079;
  }
  #record {
    border-color: #7f1d1d;
    color: #fca5a5;
    background: linear-gradient(180deg, #451215 0%, #2a0a0c 100%);
  }
  #record.on {
    background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
    color: #fff;
    border-color: #fca5a5;
    box-shadow: 0 0 16px rgba(239, 68, 68, 0.75);
  }
</style>

<main>
  <header>
    <h1>chiptune-audio 卡林巴琴</h1>
    <nav class="nav" aria-label="頁面">
      <a href="index.html">🎹 電子琴</a>
      <a href="kalimba.html" aria-current="page">🪕 卡林巴琴</a>
      <a href="score.html">🎼 琴譜</a>
      <a href="console.html">🎛 控制台</a>
      <span class="sep" aria-hidden="true">|</span>
      <a href="#boardSection">琴鍵</a>
      <a href="#setupSection">設定</a>
      <a href="#recordSection">錄音與示範</a>
    </nav>
  </header>

  <!-- 整併後的卡林巴面板：設定工具列 → 17 根簧片琴身 → 錄音與示範曲控制列 -->
  <section id="boardSection">
    <div class="row" id="setupSection" style="margin-bottom:10px">
      <label class="inline">音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" style="width:7rem"></label>
      <label class="inline">調性 <select id="tuning"></select></label>
      <label class="inline">標示 <select id="label"></select></label>
      <label class="inline">力度 <input id="velocity" type="range" min="0.3" max="1" step="0.01" value="0.85" style="width:6.5rem"></label>
      <label class="inline" title="撥簧片尾端較大聲、靠琴橋較小聲"><input id="autoVelocity" type="checkbox" checked> 位置力度</label>
      <button id="damp" title="把還在響的簧片全部悶掉">止音</button>
    </div>

    <div class="kalimba" id="board" role="group" aria-label="卡林巴琴的 17 根簧片">
      <div class="field"><div class="bridge"></div></div>
    </div>
    <div id="held" aria-live="polite"></div>

    <div class="row" id="recordSection" style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line)">
      <button id="record">● 開始錄音</button>
      <button id="exportWav">⬇ 匯出 WAV</button>
      <span class="muted" id="recInfo">還沒錄任何東西</span>
      <span class="sep" aria-hidden="true" style="margin-left:auto">|</span>
      <label class="inline">示範曲 <select id="demo"></select></label>
      <button id="playDemo">▶ 播放</button>
      <button id="stopDemo">■ 停止</button>
    </div>

    <p class="muted" id="sampleHint" style="margin:.6rem 0 .2rem">正在準備簧片的錄音…</p>
    <p class="muted" style="margin:0">
      點按或拖曳刮奏（Glissando）；中央最低音往兩側交替升高。電腦鍵盤：<kbd>1</kbd>–<kbd>9</kbd>（左至中央）、<kbd>Q</kbd>–<kbd>I</kbd>（右側）。
    </p>
  </section>
</main>

<script type="module">
  // 這一頁是新的，但 service worker 是「先用快取、背景更新」：部署後第一次開啟時，
  // 新頁面（從網路來）會配到舊快取的 src/index.js，而舊的沒有卡林巴的匯出——模組匯入
  // 失敗，畫面會是空的卡林巴（沒有任何錯誤訊息，因為模組根本沒開始跑）。
  // 所以匯入失敗就自動重載一次；那一次的 service worker 已經是新的。sessionStorage
  // 是保險：真的壞掉時只重載一次，不要變成無限重載。
  import('./page/kalimba.js')
    .then(() => sessionStorage.removeItem('kalimba:stale'))
    .catch(() => {
      if (sessionStorage.getItem('kalimba:stale')) return;
      sessionStorage.setItem('kalimba:stale', '1');
      location.reload();
    });
</script>
</html>
