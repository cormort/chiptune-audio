<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chiptune-audio 琴譜播放</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121420" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chiptune">
<link rel="stylesheet" href="page/theme.css">
<style>
  :root {
    --bg: #f3f4f7; --panel: #ffffff; --text: #1b1d24; --muted: #62677a;
    --line: #d9dce5; --accent: #3558d6; --accent-text: #ffffff; --warn: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121420; --panel: #1b1e2c; --text: #e8eaf2; --muted: #9ba1b7;
      --line: #313548; --accent: #7d9bff; --accent-text: #0e1020; --warn: #fb923c;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Noto Sans TC", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 15px; margin: 16px 0 8px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .muted { color: var(--muted); font-size: 13px; }
  button, select, input { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #page img { max-width: 100%; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  .measures { display: flex; flex-wrap: wrap; gap: 8px; }
  .m { border: 1px solid var(--line); border-radius: 6px; padding: 6px; min-width: 150px; }
  .m.bad { border-color: var(--warn); }
  .m header { display: flex; justify-content: space-between; align-items: center; gap: 4px; font-size: 13px; margin-bottom: 4px; }
  .m.bad .len { color: var(--warn); font-weight: 600; }
  .ev { display: flex; gap: 4px; margin-bottom: 4px; }
  .ev input { width: 80px; }
  .ev select { width: 70px; }
  .ev input.err { border-color: var(--warn); }
  .m button { padding: 2px 6px; }
</style>
<main>
  <header>
    <h1>chiptune-audio 琴譜播放</h1>
    <nav class="nav" aria-label="頁面">
      <a href="index.html">電子琴</a>
      <a href="kalimba.html">卡林巴琴</a>
      <a href="console.html">控制台</a>
    </nav>
  </header>

  <section>
    <div class="row">
      <input id="file" type="file" accept=".pdf,.musicxml,.xml">
      <span class="muted" id="status">選一份琴譜 PDF（需啟動 omr/server.py），或直接載入 .musicxml</span>
    </div>
    <p class="muted">辨識不是 100% 準確。小節長度和拍號不符時會標橘色——對照上方原譜修正音高、時值，再播放。</p>
  </section>

  <section id="page" hidden></section>

  <section id="editor" hidden>
    <div class="row">
      <button class="primary" id="play">▶ 播放</button>
      <button id="stop">■ 停止</button>
      <label>每小節 <input id="beats" type="number" min="1" max="16" step="0.5" style="width:56px"> 拍</label>
      <label>速度 ♩= <input id="bpm" type="number" min="30" max="240" value="88" style="width:64px"></label>
      <label>樂器 <select id="inst"></select></label>
    </div>
    <div id="parts"></div>
  </section>
</main>

<script type="module" src="page/score.js"></script>
