<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chiptune-audio 琴譜播放</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121420" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chiptune">
<link rel="stylesheet" href="page/theme.css">
<style>
  :root { --warn: #fb923c; }
  #page img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .measures { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .m {
    border: 1px solid #32384a; border-radius: 10px; padding: 8px; min-width: 164px;
    background: linear-gradient(180deg, #181b24 0%, #12151c 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 3px 8px rgba(0, 0, 0, 0.4);
  }
  .m.bad { border-color: var(--warn); box-shadow: 0 0 10px rgba(251, 146, 60, 0.25); }
  .m header {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    font-size: 12.5px; margin-bottom: 6px; padding: 4px 6px;
    background: rgba(0, 0, 0, 0.35); border-radius: 6px; border: 0; box-shadow: none;
  }
  .m.bad .len { color: var(--warn); font-weight: 700; }
  .ev { display: flex; gap: 4px; align-items: center; margin-bottom: 5px; }
  .ev input { width: 84px; font-family: var(--font-mono); font-size: 12.5px; padding: 3px 6px; min-height: 1.85rem; }
  .ev select { width: 74px; font-size: 12.5px; padding: 3px 4px; min-height: 1.85rem; }
  .ev input.err { border-color: var(--warn); }
  .m button { padding: 2px 7px; min-height: 1.7rem; font-size: 12px; }
</style>
<main>
  <header>
    <h1>chiptune-audio 琴譜播放</h1>
    <nav class="nav" aria-label="頁面">
      <a href="index.html">🎹 電子琴</a>
      <a href="kalimba.html">🪕 卡林巴琴</a>
      <a href="score.html" aria-current="page">🎼 琴譜</a>
      <a href="console.html">🎛 控制台</a>
    </nav>
  </header>

  <section>
    <div class="row">
      <input id="file" type="file" accept=".pdf,.musicxml,.xml">
      <span class="muted" id="status">選一份琴譜 PDF（需啟動 omr/server.py），或直接載入 .musicxml</span>
    </div>
    <p class="muted">辨識不是 100% 準確。小節長度和拍號不符時會標橘色——對照上方原譜修正音高、時值，再播放。</p>
  </section>

  <section id="page" hidden></section>

  <section id="editor" hidden>
    <div class="row">
      <button class="primary" id="play">▶ 播放</button>
      <button id="stop">■ 停止</button>
      <label>每小節 <input id="beats" type="number" min="1" max="16" step="0.5" style="width:56px"> 拍</label>
      <label>速度 ♩= <input id="bpm" type="number" min="30" max="240" value="88" style="width:64px"></label>
      <label>樂器 <select id="inst"></select></label>
    </div>
    <div id="parts"></div>
  </section>
</main>

<script type="module" src="page/score.js"></script>
